<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <meta name="robots" content="noindex, nofollow"/>
  <title>תצוגת טלפון</title>
  <style>
    /* Dev tool: shows any page of this site inside a phone-sized frame.
       Open /phone-preview.html?url=/services/english */
    :root {
      --ink: #111;
      --bg: #e9f7f5;
      --panel: #fff;
      --teal: #64e8de;
      --muted: #555;
    }

    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --ink: #f2f2f2;
        --bg: #171b1b;
        --panel: #232929;
        --muted: #b5b5b5;
      }
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      height: 100%;
    }

    body {
      display: flex;
      flex-direction: column;
      background: var(--bg);
      color: var(--ink);
      font-family: "Rubik", "Segoe UI", system-ui, sans-serif;
      overflow: hidden;
    }

    .bar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 12px 16px;
      background: var(--panel);
      border-bottom: 3px solid var(--ink);
    }

    .bar form {
      display: flex;
      gap: 8px;
      flex: 1 1 260px;
      max-width: 520px;
    }

    .bar input,
    .bar select,
    .bar button {
      height: 40px;
      padding: 0 12px;
      border: 2px solid var(--ink);
      border-radius: 12px;
      background: var(--panel);
      color: var(--ink);
      font: inherit;
      font-size: 0.95rem;
      font-weight: 700;
    }

    .bar input {
      flex: 1;
      min-width: 0;
      direction: ltr;
    }

    .bar button {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
    }

    .bar button:hover {
      background: var(--teal);
      color: #111;
    }

    .bar button svg {
      width: 18px;
      height: 18px;
    }

    .stage {
      flex: 1;
      min-height: 0;
      display: grid;
      place-items: center;
      padding: 16px;
    }

    /* Holds the scaled phone at its scaled size so it stays centered. */
    .fit {
      position: relative;
    }

    .phone {
      position: absolute;
      top: 0;
      left: 0;
      padding: 14px;
      border: 3px solid #111;
      border-radius: 44px;
      background: #1c1c1c;
      box-shadow: 0 18px 50px rgba(0, 0, 0, 0.3);
      transform-origin: top left;
    }

    .phone iframe {
      display: block;
      border: 0;
      border-radius: 30px;
      background: #fff;
    }

    .size {
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--muted);
      direction: ltr;
      unicode-bidi: isolate;
    }
  </style>
</head>
<body>
  <div class="bar">
    <form id="urlForm">
      <input id="url" type="text" spellcheck="false" aria-label="כתובת העמוד"/>
      <button type="submit">פתיחה</button>
    </form>
    <select id="device" aria-label="מכשיר">
      <option value="375x667">iPhone SE</option>
      <option value="390x844" selected>iPhone 14</option>
      <option value="430x932">iPhone 15 Pro Max</option>
      <option value="360x800">Android קטן</option>
      <option value="412x915">Android גדול</option>
      <option value="768x1024">טאבלט</option>
    </select>
    <button type="button" id="rotate" title="סיבוב">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg>
      סיבוב
    </button>
    <button type="button" id="reload" title="רענון">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 0 1 15-6.7L21 8M21 3v5h-5M21 12a9 9 0 0 1-15 6.7L3 16M3 21v-5h5"/></svg>
      רענון
    </button>
    <span class="size" id="size"></span>
  </div>

  <div class="stage" id="stage">
    <div class="fit" id="fit">
      <div class="phone" id="phone">
        <iframe id="frame" title="תצוגת טלפון"></iframe>
      </div>
    </div>
  </div>

  <script>
    (function () {
      const PAD = 14 + 3; // .phone padding + border
      const params = new URLSearchParams(location.search);
      const frame = document.getElementById("frame");
      const urlInput = document.getElementById("url");
      const device = document.getElementById("device");
      const phone = document.getElementById("phone");
      const fit = document.getElementById("fit");
      const stage = document.getElementById("stage");
      let landscape = params.get("landscape") === "1";

      if (params.get("device")) device.value = params.get("device");

      // Only pages of this site: a path that starts with a single "/".
      function safePath(value) {
        const path = String(value || "").trim();
        return /^\/(?!\/)/.test(path) ? path : "/services/english";
      }

      function size() {
        const [w, h] = device.value.split("x").map(Number);
        return landscape ? [h, w] : [w, h];
      }

      function layout() {
        const [w, h] = size();
        frame.style.width = `${w}px`;
        frame.style.height = `${h}px`;
        const outerW = w + PAD * 2;
        const outerH = h + PAD * 2;
        const box = stage.getBoundingClientRect();
        const scale = Math.min(1, (box.width - 32) / outerW, (box.height - 32) / outerH);
        phone.style.transform = `scale(${scale})`;
        fit.style.width = `${outerW * scale}px`;
        fit.style.height = `${outerH * scale}px`;
        document.getElementById("size").textContent = `${w} × ${h}${scale < 1 ? ` · ${Math.round(scale * 100)}%` : ""}`;
      }

      function syncAddress() {
        const next = new URLSearchParams({ url: urlInput.value, device: device.value });
        if (landscape) next.set("landscape", "1");
        history.replaceState(null, "", `?${next}`);
      }

      function open(path) {
        urlInput.value = safePath(path);
        frame.src = urlInput.value;
        syncAddress();
      }

      // Keep the address box in step with navigation inside the phone.
      frame.addEventListener("load", () => {
        try {
          const loc = frame.contentWindow.location;
          urlInput.value = loc.pathname + loc.search + loc.hash;
          frame.contentWindow.addEventListener("hashchange", () => {
            urlInput.value = loc.pathname + loc.search + loc.hash;
            syncAddress();
          });
          syncAddress();
        } catch {
          /* cross-origin page — leave the address as typed */
        }
      });

      document.getElementById("urlForm").addEventListener("submit", (e) => {
        e.preventDefault();
        open(urlInput.value);
      });
      document.getElementById("reload").addEventListener("click", () => {
        frame.contentWindow?.location.reload();
      });
      document.getElementById("rotate").addEventListener("click", () => {
        landscape = !landscape;
        layout();
        syncAddress();
      });
      device.addEventListener("change", () => {
        layout();
        syncAddress();
      });
      window.addEventListener("resize", layout);

      layout();
      open(params.get("url"));
    })();
  </script>
</body>
</html>
