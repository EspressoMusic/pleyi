<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#00C9B7" />
  <meta name="robots" content="noindex, nofollow"/>
  <title>אין חיבור — Pleyi</title>
  <!-- Shown by sw.js when there is no connection, so everything is inline:
       nothing else on the site can be loaded at that moment. -->
  <style>
    html, body {
      height: 100%;
      margin: 0;
    }

    body {
      display: grid;
      place-items: center;
      padding: 16px;
      box-sizing: border-box;
      background: #e0fbf8;
      color: #111;
      font-family: system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
      text-align: center;
    }

    .box {
      max-width: 360px;
      padding: 28px 22px;
      border: 3px solid #111;
      border-radius: 22px;
      background: #b8fff5;
      box-shadow: 5px 6px 0 0 #111;
    }

    .icon {
      width: 64px;
      height: 64px;
    }

    h1 {
      margin: 12px 0 8px;
      font-size: 1.6rem;
      font-weight: 900;
    }

    p {
      margin: 0 0 4px;
      font-size: 1.05rem;
      font-weight: 700;
      line-height: 1.5;
    }

    button {
      margin-top: 18px;
      padding: 12px 28px;
      border: 3px solid #111;
      border-radius: 999px;
      background: #fff3a8;
      color: #111;
      font: inherit;
      font-size: 1.1rem;
      font-weight: 900;
      box-shadow: 4px 5px 0 0 #111;
      cursor: pointer;
    }

    button:active {
      transform: translate(3px, 4px);
      box-shadow: 1px 1px 0 0 #111;
    }
  </style>
</head>
<body>
  <main class="box">
    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="#111" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M2 8.5a15 15 0 0 1 20 0M5 12a10 10 0 0 1 14 0M8.5 15.5a5 5 0 0 1 7 0"/>
      <circle cx="12" cy="19" r="1.2" fill="#111"/>
      <path d="M3 3l18 18"/>
    </svg>
    <h1>אין חיבור לאינטרנט</h1>
    <p>בדקו שהטלפון מחובר.</p>
    <p>אחר כך לחצו על "לנסות שוב".</p>
    <button type="button" onclick="location.reload()">לנסות שוב</button>
  </main>
</body>
</html>
